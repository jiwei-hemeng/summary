<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>甜蜜烘焙坊 · 首页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部欢迎语 背景色 -->
  <div class="welcomebar">
    欢迎来到甜蜜烘焙坊 · 每日新鲜出炉
  </div>

  <!-- 头部：logo + 搜索框 -->
  <div class="header">
    <div class="logobox">
      <span class="logotext">🍞 甜蜜烘焙坊</span>
    </div>
    <div class="searchbox">
      <input type="text" class="searchinput" placeholder="搜索面包、蛋糕...">
      <button class="searchbtn">搜索</button>
    </div>
  </div>

  <!-- 导航栏 -->
  <div class="nav">
    <a href="index.html" class="navlink active">首页</a>
    <a href="products.html" class="navlink">产品中心</a>
    <a href="cart.html" class="navlink">购物车</a>
    <a href="about.html" class="navlink">关于我们</a>
    <a href="message.html" class="navlink">留言板</a>
  </div>

  <div class="banner">
    <img src="images/banner.jpg" alt="banner">
  </div>

  <!-- 内容区域 宽1200px 居中 -->
  <div class="container">
    <h1 class="pagetitle">欢迎光临甜蜜烘焙坊</h1>
    <p class="welcomepara">用爱烘焙，用心传递。每天清晨新鲜现烤，只为给你最温暖的味道。</p>

    <!-- 商品推荐区块 -->
    <div class="featured">
      <h2 class="sectiontitle">今日推荐</h2>
      <div class="productlist">
        <div class="productcard">
          <div class="productimg">
            <img src="images/jingdian.jpg">
          </div>
          <h3 class="productname">经典可颂</h3>
          <p class="productprice">¥ 18.00</p>
        </div>
        <div class="productcard">
          <div class="productimg">
            <img src="images/caomei.jpg">
          </div>
          <h3 class="productname">草莓蛋糕</h3>
          <p class="productprice">¥ 32.00</p>
        </div>
        <div class="productcard">
          <div class="productimg">
            <img src="images/fashi.jpg">
          </div>
          <h3 class="productname">法式长棍</h3>
          <p class="productprice">¥ 15.00</p>
        </div>
        <div class="productcard">
          <div class="productimg">
            <img src="images/quqi.jpg">
          </div>
          <h3 class="productname">巧克力曲奇</h3>
          <p class="productprice">¥ 22.00</p>
        </div>
      </div>
    </div>

    <!-- 烘焙小贴士 -->
    <div class="tipsbox">
      <h2 class="sectiontitle">烘焙小贴士</h2>
      <p class="tippara">面包出炉后不要立即密封，让其自然冷却15分钟，外皮会更酥脆。保存时建议冷冻而非冷藏，复烤后口感如初。</p>
    </div>
  </div>

  <!-- 简单页脚 -->
  <div class="footer">
    <p class="footertext">甜蜜烘焙坊 · 用心烘焙每一份幸福</p>
  </div>

</body>
</html>
