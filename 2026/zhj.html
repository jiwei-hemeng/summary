<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>祝张会娟生日快乐</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Microsoft Yahei", sans-serif;
      }
      .wrap {
        position: fixed;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        padding: 20px;
        text-align: center;
      }
      .title {
        font-size: clamp(2rem, 14vw, 4rem);
        font-weight: bold;
        background: linear-gradient(
          90deg,
          #ff4444,
          #ffdd00,
          #44ff44,
          #44ddff,
          #dd44ff
        );
        background-size: 400% 400%;
        background-clip: text;
        color: transparent;
        animation: gradient 3s ease infinite;
        text-shadow: 0 0 20px rgba(255, 200, 200, 0.4);
        line-height: 1.4;
      }
      .tip {
        position: fixed;
        bottom: 40px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #fff8;
        font-size: 14px;
        z-index: 10;
      }
      @keyframes gradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title">祝张会娟生日快乐 🎂</div>
    </div>
    <div class="tip">点击屏幕播放音乐✨</div>
    <canvas id="fire"></canvas>
    <audio id="bgm" loop preload="auto">
      <source
        src="https://music.163.com/song/media/outer/url?id=208378.mp3"
        type="audio/mpeg"
      />
    </audio>

    <script>
      const canvas = document.getElementById("fire");
      const ctx = canvas.getContext("2d");
      const bgm = document.getElementById("bgm");
      let audioPlayed = false;

      // 移动端尺寸
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      // 点击屏幕开音乐
      document.body.addEventListener("click", () => {
        if (!audioPlayed) {
          bgm.play().catch((e) => {});
          audioPlayed = true;
        }
      });

      class Particle {
        constructor(x, y, color, speed, angle, life, size) {
          this.x = x;
          this.y = y;
          this.color = color;
          this.speed = speed;
          this.angle = angle;
          this.life = life;
          this.maxLife = life;
          this.size = size;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vy += 0.04;
          this.life--;
        }
        draw() {
          let alpha = this.life / this.maxLife;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color.replace("1)", alpha + ")");
          ctx.fill();
        }
      }
      let particles = [];
      const colors = [
        "rgba(255,50,50,1)",
        "rgba(255,220,50,1)",
        "rgba(50,255,100,1)",
        "rgba(50,180,255,1)",
        "rgba(220,80,255,1)",
        "rgba(255,255,255,1)",
      ];
      function createFirework() {
        let x = Math.random() * canvas.width;
        let y = Math.random() * canvas.height * 0.35 + 60;
        let count = 50; // 手机减少粒子，防止卡顿
        let c = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < count; i++) {
          let ang = ((Math.PI * 2) / count) * i + Math.random() * 0.4;
          let spd = Math.random() * 3 + 1.5;
          particles.push(
            new Particle(
              x,
              y,
              c,
              spd,
              ang,
              50 + Math.random() * 25,
              Math.random() * 1.5 + 0.8,
            ),
          );
        }
      }
      function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.07)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          let p = particles[i];
          p.update();
          p.draw();
          if (p.life <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(draw);
      }
      draw();
      setInterval(createFirework, 850);

      // 爱心飘落
      const heartCanvas = document.createElement("canvas");
      heartCanvas.style.position = "fixed";
      heartCanvas.style.top = "0";
      heartCanvas.style.left = "0";
      heartCanvas.style.zIndex = "2";
      heartCanvas.style.pointerEvents = "none";
      document.body.appendChild(heartCanvas);
      const hctx = heartCanvas.getContext("2d");
      function resizeHeart() {
        heartCanvas.width = innerWidth;
        heartCanvas.height = innerHeight;
      }
      resizeHeart();
      window.addEventListener("resize", resizeHeart);
      let hearts = [];
      class Heart {
        constructor() {
          this.x = Math.random() * heartCanvas.width;
          this.y = -30;
          this.size = Math.random() * 10 + 6;
          this.speedY = Math.random() * 1 + 0.4;
          this.speedX = (Math.random() - 0.5) * 0.8;
          this.alpha = Math.random() * 0.4 + 0.4;
        }
        draw() {
          hctx.save();
          hctx.translate(this.x, this.y);
          hctx.globalAlpha = this.alpha;
          hctx.beginPath();
          hctx.moveTo(0, 0);
          hctx.bezierCurveTo(
            -this.size,
            -this.size / 2,
            -this.size,
            -this.size,
            0,
            -this.size * 0.4,
          );
          hctx.bezierCurveTo(
            this.size,
            -this.size,
            this.size,
            -this.size / 2,
            0,
            0,
          );
          hctx.fillStyle = "#ff6699";
          hctx.fill();
          hctx.restore();
        }
        update() {
          this.y += this.speedY;
          this.x += this.speedX;
        }
      }
      function loopHeart() {
        hctx.clearRect(0, 0, heartCanvas.width, heartCanvas.height);
        if (Math.random() > 0.72) hearts.push(new Heart());
        for (let i = hearts.length - 1; i >= 0; i--) {
          let h = hearts[i];
          h.update();
          h.draw();
          if (h.y > heartCanvas.height) hearts.splice(i, 1);
        }
        requestAnimationFrame(loopHeart);
      }
      loopHeart();
    </script>
  </body>
</html>
